<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#222229" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CircuitBin">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>CircuitBin</title>
  <!-- estilo AMSTech: letras, colores y componentes compartidos (public/amstech-ui, ver su README) y lo propio de la app en style.css -->
  <link rel="stylesheet" href="amstech-ui/fuentes.css">
  <link rel="stylesheet" href="amstech-ui/tokens.css">
  <link rel="stylesheet" href="amstech-ui/componentes.css">
  <link rel="stylesheet" href="style.css">
  <link rel="preload" href="amstech-ui/fuentes/figtree-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <header class="top">
    <a class="logo" href="#/" aria-label="CircuitBin, home" data-i18n-aria="CircuitBin, inicio"><svg class="cb-logo" width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><g class="cb-pins"><rect x="2" y="21" width="7" height="4.5" rx="1.5"/><rect x="2" y="30" width="7" height="4.5" rx="1.5"/><rect x="2" y="39" width="7" height="4.5" rx="1.5"/><rect x="55" y="21" width="7" height="4.5" rx="1.5"/><rect x="55" y="30" width="7" height="4.5" rx="1.5"/><rect x="55" y="39" width="7" height="4.5" rx="1.5"/></g><rect class="cb-bin" x="8" y="10" width="48" height="44" rx="10"/><rect class="cb-label" x="16" y="17" width="32" height="9" rx="3.5"/><path class="cb-trace" d="M20 42 H29 L35 35 H44"/><circle class="cb-node" cx="20" cy="42" r="3"/><circle class="cb-node" cx="44" cy="35" r="3"/></svg>CircuitBin<span>amstech</span></a>
    <nav id="nav">
      <a href="#/" data-v="inventario"><span data-i18n="Inventario">Inventory</span><span class="n" id="n-inv"></span></a>
      <a href="#/proyectos" data-v="proyectos"><span data-i18n="Proyectos">Projects</span><span class="n" id="n-pro"></span></a>
      <a href="#/glosario" data-v="glosario"><span data-i18n="Glosario">Glossary</span><span class="n" id="n-glo"></span></a>
      <a href="#/ajustes" data-v="ajustes"><span data-i18n="Ajustes">Settings</span></a>
    </nav>
    <div class="top-der">
      <label class="buscar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><input id="q" type="search" placeholder="Search parts, pins…" data-i18n-placeholder="Buscar piezas, pines…" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="Search (key /)" data-i18n-aria="Buscar (tecla /)"><kbd aria-hidden="true">/</kbd></label>
      <button id="buscar-abrir" class="btn icono buscar-abrir" type="button" aria-label="Search" data-i18n-aria="Buscar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></button>
      <button id="tema" class="tema" type="button" title="Switch theme" data-i18n-title="Cambiar tema">Theme</button>
    </div>
  </header>
  <p id="sin-red" class="sin-red" role="status" hidden><span id="sin-red-txt"></span> <button id="sin-red-btn" class="tema" type="button" data-i18n="Reintentar">Retry</button></p>
  <main id="app"><p class="gris" data-i18n="Cargando…">Loading…</p></main>
  <!-- móvil: barra de abajo, al alcance del pulgar; el «+» del centro abre el menú de añadir -->
  <nav id="barra" class="barra" aria-label="Sections" data-i18n-aria="Secciones">
    <a href="#/" data-v="inventario"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg><span data-i18n="Inventario">Inventory</span></a>
    <a href="#/glosario" data-v="glosario"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg><span data-i18n="Glosario">Glossary</span></a>
    <a id="fab" class="fab" href="#/nuevo" aria-label="Add part" data-i18n-aria="Añadir pieza" aria-haspopup="menu" aria-expanded="false" aria-controls="fab-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
    <a href="#/proyectos" data-v="proyectos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v5l-5 9a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-5-9V3"/><path d="M8 3h8M7 14h10"/></svg><span data-i18n="Proyectos">Projects</span></a>
    <a href="#/ajustes" data-v="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span data-i18n="Ajustes">Settings</span></a>
  </nav>
  <div id="fab-menu" class="fab-menu" role="menu" hidden>
    <label class="fab-op" role="menuitem"><span class="fab-ico prim"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span><span data-i18n="Foto con IA">Photo with AI</span><span class="sub" data-i18n="abre la cámara y la analiza">opens the camera and analyzes it</span></span>
      <input type="file" accept="image/*" capture="environment" id="fab-camara" hidden></label>
    <label class="fab-op" role="menuitem"><span class="fab-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M5 18l5-5 3 3 2-2 4 4"/></svg></span><span><span data-i18n="Elegir foto con IA">Choose photo with AI</span><span class="sub" data-i18n="de la galería">from your gallery</span></span>
      <input type="file" accept="image/*" id="fab-galeria" hidden></label>
    <a class="fab-op" role="menuitem" href="#/ia/varias"><span class="fab-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="7" height="7" rx="1"/><rect x="13" y="11" width="7" height="7" rx="1"/><path d="M4 17h6M14 7h6"/></svg></span><span><span data-i18n="Varias piezas en una foto">Multiple parts in one photo</span><span class="sub" data-i18n="la IA las separa y las identifica">AI separates and identifies them</span></span></a>
    <a class="fab-op" role="menuitem" href="#/nuevo"><span class="fab-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19l1-4L16 5l3 3L9 18z"/><path d="M14 7l3 3"/></svg></span><span><span data-i18n="A mano">Manual entry</span><span class="sub" data-i18n="rellenas tú la ficha">fill in the details yourself</span></span></a>
  </div>
  <div id="toast" role="status"></div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
