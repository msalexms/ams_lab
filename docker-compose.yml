# Homelab: copia la carpeta al servidor y `docker compose up -d --build` → http://<servidor>:4321
# La base de datos y las fotos quedan en ./data; cada día se hace una copia en ./data/copias (mejor en otro disco: ver abajo).
# Solo red local / Tailscale. Para usarla sin conexión en el móvil hace falta HTTPS: `tailscale serve --bg 4321` (README).
services:
  circuitbin:
    build: .
    image: circuitbin:latest
    container_name: circuitbin
    restart: unless-stopped
    init: true
    ports:
      - "4321:4321"
    environment:
      - TZ=${TZ:-Europe/Madrid}           # fecha de las copias
      # - AMS_LAB_COPIAS=/copias          # copias en otro disco (descomenta también el volumen)
      # - AMS_LAB_COPIAS_MAX=14           # copias diarias que se guardan (0 = ninguna)
    volumes:
      - ./data:/data
      # - /mnt/otro-disco/circuitbin-copias:/copias
