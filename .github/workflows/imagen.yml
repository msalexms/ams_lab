# Construye la imagen Docker y la publica (privada) en ghcr.io/msalexms/circuitbin.
# En PRs solo comprueba que se construye; en main la publica.
# El homelab la despliega desde homelab-ops (stacks/ams-lab), fijada por digest.
name: imagen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    name: imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/msalexms/circuitbin
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Imagen publicada"
            echo
            echo "Para desplegarla, en homelab-ops (stacks/ams-lab/docker-compose.yml):"
            echo
            echo '```'
            echo "image: ghcr.io/msalexms/circuitbin:sha-${GITHUB_SHA::7}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
